name: Security

# Dependency-vulnerability audit of the WHOLE lock: every extra and every dependency group,
# resolved from uv.lock without installing anything.
#
# Why the whole lock: an audit of the installed dev environment misses whatever an extra pulls
# in. settfex learned this on 2026-11-02, when its job printed "No known vulnerabilities found"
# while a full-lock audit found 103 advisories in its `examples` extra. tvkit's own full-lock
# audit the same day found 31 advisories in 4 packages (cleared in 0.18.1).
#
# A failing run is a signal, not a gate: `main` has no required status checks, so a red
# Security check never blocks a merge. It runs on PRs too, so an advisory shows up on the PR
# that brings the package in, not weeks later.

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "41 2 * * 1" # Mondays 02:41 UTC — new advisories land against an unchanged lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit (full lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          # Pinned: Dependabot bumps the action, never its inputs. Bump by hand.
          version: "0.13.6"
          enable-cache: false

      - name: Export the full lock (all extras, all groups)
        run: >-
          uv export --frozen --all-extras --all-groups --no-emit-project
          --format requirements-txt -o requirements-all.txt

      # --disable-pip --no-deps: audit exactly the pinned set, never re-resolve it.
      # Read the summary line ("Found N known vulnerabilities in M packages" / "No known
      # vulnerabilities found"), not the tail of the table: the table is not sorted by package.
      - name: Audit
        run: >-
          uvx pip-audit@2.10.1 -r requirements-all.txt --disable-pip --no-deps --desc on
