name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/ruff-lint.yml"
      - ".pre-commit-config.yaml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/ruff-lint.yml"
      - ".pre-commit-config.yaml"

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    env:
      # Pin EVERY uv command in this job to the floor interpreter.
      # `uv python install 3.11` alone is not enough: `uv sync` and `uv run` honour the
      # tracked .python-version (3.12) and will silently rebuild the venv at 3.12, so
      # this job would report success without ever exercising 3.11.
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - run: uv python install 3.11
      - run: uv sync --extra dev

      - run: uv run ruff check .
      - run: uv run ruff format --check .

  quality:
    name: Type & Tests
    runs-on: ubuntu-latest
    needs: ruff
    env:
      # See the note in the `ruff` job — without this, mypy and pytest run on 3.12.
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - run: uv python install 3.11
      - run: uv sync --extra dev

      - run: uv run mypy tvkit/
      - run: uv run pytest --cov=tvkit --cov-branch --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
