name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "tests/**"
      - "uv.lock"
      - ".github/workflows/ruff-lint.yml"
      - ".pre-commit-config.yaml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/ruff-lint.yml"
      - ".pre-commit-config.yaml"

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    env:
      # Pin EVERY uv command in this job to the floor interpreter.
      # `uv python install 3.11` alone is not enough: `uv sync` and `uv run` honour the
      # tracked .python-version (3.12) and will silently rebuild the venv at 3.12, so
      # this job would report success without ever exercising 3.11.
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          # Pinned, not "latest". Dependabot bumps the action, never its inputs — bump by hand.
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - run: uv python install 3.11
      - run: uv sync --extra dev

      - run: uv run ruff check .
      - run: uv run ruff format --check .

  quality:
    name: Type & Tests
    runs-on: ubuntu-latest
    needs: ruff
    env:
      # See the note in the `ruff` job — without this, mypy and pytest run on 3.12.
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          # Pinned, not "latest". Dependabot bumps the action, never its inputs — bump by hand.
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - run: uv python install 3.11
      - run: uv sync --extra dev

      - run: uv run mypy tvkit/
      - run: uv run pytest --cov=tvkit --cov-branch --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
