# Triggered by version tags: v0.11.1, v1.0.0, v1.0.0-beta.1, etc.
# Pipeline: validate tag → CI → build → publish PyPI → create GitHub Release
#
# One-time setup required (see docs/development/release-process.md):
#   1. PyPI Trusted Publisher configured for this workflow + environment "pypi"
#   2. GitHub environment "pypi" created in repo Settings → Environments

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# Least privilege: every job gets read-only contents unless it says otherwise. Only
# publish-pypi can mint the OIDC token, and only github-release can write to the repo.
# Previously both grants applied to every job, including `ci`, which installs the dev
# dependencies and runs the test suite.
permissions:
  contents: read

jobs:
  # ── 1. Validate tag matches pyproject.toml version ──────────────────────────
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse tag and detect pre-release
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches pyproject.toml
        env:
          # Via env, not `${{ }}` inside the script: the tag pattern 'v*.*.*-*' allows any
          # suffix, and an expression is pasted into the shell source before it runs.
          TAG_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: pyproject.toml=${PYPROJECT_VERSION}, tag=${TAG_VERSION}"
            echo "   Bump the version in pyproject.toml before tagging."
            exit 1
          fi
          echo "✅ Version ${TAG_VERSION} matches pyproject.toml"

  # ── 2. Full CI gate (mirrors ruff-lint.yml) ─────────────────────────────────
  ci:
    name: CI
    needs: validate
    runs-on: ubuntu-latest
    env:
      # Pin EVERY uv command in this job to the floor interpreter.
      # `uv python install 3.11` alone is not enough: `uv sync` and `uv run` honour the
      # tracked .python-version (3.12) and will silently rebuild the venv at 3.12, so
      # this gate would report success without ever exercising 3.11.
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Pinned, not "latest": the release build should not adopt whatever uv shipped that
          # day. Dependabot bumps the action, never its inputs — bump this by hand.
          version: "0.13.6"
          # No cache in the release pipeline: the artifact is built from a clean resolve.
          enable-cache: false

      - run: uv python install 3.11
      - run: uv sync --extra dev

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy tvkit/
      - run: uv run pytest --cov=tvkit --cov-branch -v

  # ── 3. Build sdist + wheel ───────────────────────────────────────────────────
  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    env:
      # See the note in the `ci` job — build the artifact on the declared floor.
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Pinned, not "latest": the release build should not adopt whatever uv shipped that
          # day. Dependabot bumps the action, never its inputs — bump this by hand.
          version: "0.13.6"
          # No cache in the release pipeline: the artifact is built from a clean resolve.
          enable-cache: false

      - run: uv python install 3.11
      - run: uv run python -m build

      - name: Verify dist contents
        run: ls -lh dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ── 4. Publish to PyPI (Trusted Publisher — no token needed) ─────────────────
  publish-pypi:
    name: Publish → PyPI
    # `validate` is listed so `needs.validate.outputs.version` resolves in the environment URL
    # below; with only `build`, the URL rendered as https://pypi.org/project/tvkit//.
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publisher — this job only
    environment:
      name: pypi
      url: https://pypi.org/project/tvkit/${{ needs.validate.outputs.version }}/

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
        # Uses OIDC Trusted Publisher — no PYPI_TOKEN secret required.
        # skip-existing: true allows re-running the workflow if the file was already
        # published manually (e.g. via scripts/publish.sh) without failing the job.
        # Fallback token auth: add PYPI_API_TOKEN to repo secrets and uncomment:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

  # ── 5. Create GitHub Release with changelog body ─────────────────────────────
  github-release:
    name: GitHub Release
    needs: [validate, publish-pypi]
    runs-on: ubuntu-latest
    if: always() && needs.validate.result == 'success' && needs.publish-pypi.result != 'failure'
    permissions:
      contents: write   # create the GitHub Release and upload assets — this job only

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Extract changelog section
        id: changelog
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 - "$VERSION" <<'PYEOF'
          import re, sys
          version = sys.argv[1]
          content = open("CHANGELOG.md").read()
          pattern = rf"(?m)^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          notes = match.group(1).strip() if match else f"Release v{version}"
          notes = notes.rstrip("-").rstrip()  # drop trailing '---' changelog separator
          with open("release_notes.txt", "w") as f:
              # Trailing newline keeps the closing GITHUB_OUTPUT heredoc delimiter
              # ('CHANGELOG_EOF') on its own line — otherwise the job fails with
              # "Matching delimiter not found".
              f.write(notes + "\n")
          PYEOF
          {
            echo 'notes<<CHANGELOG_EOF'
            cat release_notes.txt
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "tvkit v${{ needs.validate.outputs.version }}"
          body: ${{ steps.changelog.outputs.notes }}
          prerelease: ${{ needs.validate.outputs.is_prerelease }}
          files: dist/*
          make_latest: ${{ needs.validate.outputs.is_prerelease == 'false' }}
